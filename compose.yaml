
services:
  db:
    image: postgres:18
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: jenishshrestha27/project-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.multistage
    container_name: project-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: jenishshrestha27/project-frontend:latest
    build:
      context: ./next-ui
      dockerfile: Dockerfile.multistage
    container_name: project-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      API_INTERNAL_URL: "http://backend:8000"
    depends_on:
      - backend

volumes:
  postgres-data:
    name: postgres-data

networks:
  default:
    external: true
    name: common-network
